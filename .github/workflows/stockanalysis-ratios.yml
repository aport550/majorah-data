name: Stock Analysis - Quarterly Ratios

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Test tickers (NVDA AAPL); leave blank for full universe"
        required: false
        default: ""
        type: string
      sleep_seconds:
        description: "Seconds between requests, plus 0–1 second jitter"
        required: true
        default: "3"
        type: string
      refresh:
        description: "Ignore cached pages and fetch fresh data"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: stockanalysis-ratios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Show checked-out branch and commit
        run: |
          pwd
          git branch --show-current
          git log -1 --format="%h %s"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install "pandas>=2.2,<3" "requests>=2.32,<3" "lxml>=5,<7"

      - name: Restore page cache
        uses: actions/cache/restore@v4
        with:
          path: data/stockanalysis_cache
          key: stockanalysis-html-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            stockanalysis-html-v1-${{ github.ref_name }}-

      - name: Locate script and extract quarterly ratios
        env:
          INPUT_TICKERS: ${{ inputs.tickers }}
          INPUT_SLEEP: ${{ inputs.sleep_seconds }}
          INPUT_REFRESH: ${{ inputs.refresh }}
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          import math
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys

          root = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          os.chdir(root)

          print(f"Repository: {root}", flush=True)

          matches = sorted(
              path
              for path in root.rglob("build_stockanalysis_ratios.py")
              if path.is_file() and ".git" not in path.relative_to(root).parts
          )

          print(
              "Matching scripts:",
              [str(path.relative_to(root)) for path in matches],
              flush=True,
          )

          if len(matches) != 1:
              print("Python files actually present:", flush=True)

              for path in sorted(root.rglob("*.py")):
                  if ".git" not in path.relative_to(root).parts:
                      print(repr(str(path.relative_to(root))), flush=True)

              raise SystemExit(
                  "Expected exactly one build_stockanalysis_ratios.py. "
                  "Check its exact filename and that it is committed "
                  "to the branch selected for this workflow."
              )

          script_path = matches[0]

          tickers = [
              ticker
              for ticker in re.split(
                  r"[\s,]+",
                  os.environ.get("INPUT_TICKERS", "").strip()
              )
              if ticker
          ]

          try:
              delay = float(os.environ.get("INPUT_SLEEP", "3"))
          except ValueError:
              raise SystemExit("Sleep must be a number, such as 3 or 5.")

          if not math.isfinite(delay) or delay < 0:
              raise SystemExit("Sleep must be a finite, nonnegative number.")

          # Prefer the universe at the repository root.
          universe_path = root / "data" / "universe.csv"

          # If the full-universe run needs it, locate a nested copy.
          if not tickers and not universe_path.is_file():
              universe_matches = sorted(
                  path
                  for path in root.rglob("universe.csv")
                  if path.is_file()
                  and ".git" not in path.relative_to(root).parts
              )

              print(
                  "Universe candidates:",
                  [str(path.relative_to(root)) for path in universe_matches],
                  flush=True,
              )

              if len(universe_matches) != 1:
                  raise SystemExit(
                      "Cannot identify universe.csv. Commit it at "
                      "data/universe.csv, or enter NVDA AAPL to test "
                      "without a universe file."
                  )

              universe_path = universe_matches[0]

          output_dir = root / "ratio_results"
          output_dir.mkdir(parents=True, exist_ok=True)

          # Remove only these generated outputs so an unsuccessful run
          # cannot upload an old CSV that was checked into the repository.
          for filename in (
              "stockanalysis_ratios.csv",
              "stockanalysis_ratios_status.csv",
          ):
              (output_dir / filename).unlink(missing_ok=True)

          command = [
              sys.executable,
              str(script_path),
              "--sleep", str(delay),
              "--cache-dir", str(root / "data" / "stockanalysis_cache"),
              "--output", str(output_dir / "stockanalysis_ratios.csv"),
              "--status-output",
              str(output_dir / "stockanalysis_ratios_status.csv"),
          ]

          if tickers:
              command.extend(["--tickers", *tickers])
          else:
              command.extend(["--universe", str(universe_path)])

          if os.environ.get("INPUT_REFRESH", "").lower() == "true":
              command.append("--refresh")

          print(f"Using script: {script_path}", flush=True)
          print(
              f"Tickers: {tickers}" if tickers else f"Universe: {universe_path}",
              flush=True,
          )

          raise SystemExit(subprocess.call(command, cwd=root))
          PY

      - name: Upload CSV results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stockanalysis-ratios-${{ github.run_number }}-${{ github.run_attempt }}
          path: ratio_results/*.csv
          if-no-files-found: warn
          retention-days: 30

      - name: Save page cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/stockanalysis_cache
          key: stockanalysis-html-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
