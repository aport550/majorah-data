name: Build Return Matrix

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *" # daily 6am UTC

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: return-matrix
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Debug: show repo structure
        shell: bash
        run: |
          set -e
          echo "Repo root:"
          ls -lah
          echo ""
          echo "Workflows:"
          ls -lah .github/workflows || true
          echo ""
          echo "Scripts:"
          ls -lah scripts || true
          echo ""
          echo "Does clustering script exist?"
          if [ -f scripts/build_clusters.py ]; then
            echo "OK: scripts/build_clusters.py exists"
          else
            echo "ERROR: scripts/build_clusters.py is missing"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          set -e
          pip install pandas numpy yfinance scipy

      - name: Run return matrix script
        shell: bash
        run: |
          set -e
          mkdir -p data
          python scripts/build_return_matrix.py

      - name: Build clusters
        shell: bash
        run: |
          set -e
          python scripts/build_clusters.py

      - name: Verify outputs exist (MUST include clusters.json)
        shell: bash
        run: |
          set -e
          echo "Listing data/:"
          ls -lah data || true
          test -f data/daily_returns.csv
          test -f data/correlation_matrix.csv
          test -f data/clusters.json
          echo "✅ All outputs exist."

      - name: Upload outputs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: return-matrix
          path: |
            data/daily_returns.csv
            data/correlation_matrix.csv
            data/clusters.json
          if-no-files-found: error

      - name: Create/Update PR (optional)
        continue-on-error: true
        uses: peter-evans/create-pull-request@v6
        with:
          branch: auto/return-matrix
          base: main
          title: "Auto update return matrix"
          commit-message: "Auto update return matrix"
          body: "Automated update of daily_returns.csv, correlation_matrix.csv, clusters.json"
          add-paths: |
            data/daily_returns.csv
            data/correlation_matrix.csv
            data/clusters.json
          delete-branch: false
