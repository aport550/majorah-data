name: Build Return Matrix

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *" # daily 6am UTC

permissions:
  contents: write

concurrency:
  group: return-matrix
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pandas numpy yfinance

      - name: Run return matrix script
        run: python scripts/build_return_matrix.py

      - name: Commit & push results (safe fast-forward)
        run: |
          set -e

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # Ensure we're on the latest remote main RIGHT BEFORE we commit
          git fetch origin main
          git checkout main
          git reset --hard origin/main

          # Re-stage outputs after reset (reset clears index)
          git add data/daily_returns.csv data/correlation_matrix.csv

          # If nothing changed, stop
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Auto update return matrix"
          git push origin main
