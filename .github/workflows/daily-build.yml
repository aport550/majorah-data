name: Build Return Matrix

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

concurrency:
  group: return-matrix
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git/network
        run: |
          git config --global http.version HTTP/1.1
          git config --global http.postBuffer 524288000
          git config --global core.compression 0

      - name: Debug repo structure
        run: |
          set -e
          echo "Repo root:"
          ls -lah
          echo ""
          echo "Scripts:"
          ls -lah scripts || true
          echo ""

          for f in \
            scripts/build_return_matrix.py \
            scripts/build_macro_dimensions.py \
            scripts/build_stock_macro_exposures.py \
            scripts/build_clusters.py \
            scripts/build_return_decomposition.py \
            scripts/build_top_correlations.py \
            scripts/build_dividends.py \
            scripts/build_sectors.py \
            scripts/build_fundamental_trends.py
          do
            if [ -f "$f" ]; then
              echo "OK: $f exists"
            else
              echo "ERROR: $f is missing"
              exit 1
            fi
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance scipy requests

      - name: Create output directories
        run: |
          mkdir -p data
          mkdir -p public/data

      - name: Run return matrix script
        run: |
          python scripts/build_return_matrix.py
          ls -lah data || true
          ls -lah public/data || true

      - name: Build macro dimensions
        run: |
          python scripts/build_macro_dimensions.py
          ls -lah public/data || true

      - name: Build stock macro exposures
        run: |
          python scripts/build_stock_macro_exposures.py
          ls -lah public/data || true

      - name: Build clusters
        run: |
          python scripts/build_clusters.py
          echo "Cluster files:"
          ls -lah data/clusters.json || true
          ls -lah data/stock_clusters.json || true
          ls -lah public/data/clusters.json || true
          ls -lah public/data/stock_clusters.json || true

      - name: Build return decomposition
        run: |
          python scripts/build_return_decomposition.py
          echo "Return decomposition outputs:"
          ls -lah data/return_decomposition.csv || true
          ls -lah public/data/return_decomposition.json || true
          ls -lah public/data/return_decomposition_by_ticker.json || true
          ls -lah public/data/return_decomposition_summary.json || true

      - name: Remove oversized redundant flat decomposition JSON
        run: |
          rm -f public/data/return_decomposition.json
          echo "Removed public/data/return_decomposition.json to reduce push size"

      - name: Build top correlations
        run: |
          python scripts/build_top_correlations.py
          ls -lah public/data || true

      - name: Build dividends
        run: |
          python scripts/build_dividends.py
          ls -lah public/data || true

      - name: Build sectors
        run: |
          python scripts/build_sectors.py
          ls -lah public/data || true

      - name: Build fundamental trends
        run: |
          python scripts/build_fundamental_trends.py
          ls -lah public/data || true

      - name: Verify outputs
        run: |
          ls -lah data || true
          ls -lah public || true
          ls -lah public/data || true

          test -f data/daily_returns.csv
          test -f data/correlation_matrix.csv
          test -f data/macro_dimension_scores.csv
          test -f data/stock_macro_exposures.csv
          test -f data/return_decomposition.csv

          test -f public/data/clusters.json
          test -f public/data/top_correlations.json
          test -f public/data/vols.json
          test -f public/data/covariance_matrix.csv
          test -f public/data/expected_returns.json
          test -f public/data/dividends.json
          test -f public/data/sectors.json
          test -f public/data/fundamental_trends.json
          test -f public/data/macro_dimension_scores.json
          test -f public/data/stock_macro_exposures.json
          test -f public/data/return_decomposition_by_ticker.json
          test -f public/data/return_decomposition_summary.json

          echo "All required outputs exist."

      - name: Show git status and diff
        run: |
          echo "Git status:"
          git status --short
          echo ""
          echo "Git diff stat:"
          git diff --stat || true
          echo ""
          ls -lah public/data/return_decomposition_by_ticker.json || true
          ls -lah public/data/return_decomposition_summary.json || true

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: return-matrix
          path: |
            data/daily_returns.csv
            data/correlation_matrix.csv
            data/macro_dimension_scores.csv
            data/stock_macro_exposures.csv
            data/return_decomposition.csv
            public/data/clusters.json
            public/data/top_correlations.json
            public/data/vols.json
            public/data/covariance_matrix.csv
            public/data/expected_returns.json
            public/data/dividends.json
            public/data/sectors.json
            public/data/fundamental_trends.json
            public/data/macro_dimension_scores.json
            public/data/stock_macro_exposures.json
            public/data/return_decomposition_by_ticker.json
            public/data/return_decomposition_summary.json
          if-no-files-found: error

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/daily_returns.csv \
            data/correlation_matrix.csv \
            data/macro_dimension_scores.csv \
            data/stock_macro_exposures.csv \
            data/return_decomposition.csv \
            public/data/clusters.json \
            public/data/top_correlations.json \
            public/data/dividends.json \
            public/data/sectors.json \
            public/data/fundamental_trends.json \
            public/data/vols.json \
            public/data/covariance_matrix.csv \
            public/data/expected_returns.json \
            public/data/macro_dimension_scores.json \
            public/data/stock_macro_exposures.json \
            public/data/return_decomposition_by_ticker.json \
            public/data/return_decomposition_summary.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "HAS_CHANGES=false" >> $GITHUB_ENV
          else
            git commit -m "Auto update return matrix"
            echo "HAS_CHANGES=true" >> $GITHUB_ENV
          fi

      - name: Pull latest main before push
        if: env.HAS_CHANGES == 'true'
        run: |
          git pull --rebase origin main

      - name: Push to main
        if: env.HAS_CHANGES == 'true'
        run: |
          git push origin HEAD:main
