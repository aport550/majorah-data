name: Build Return Matrix

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *" # daily 6am UTC

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: return-matrix
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install pandas numpy yfinance

      - run: python scripts/build_return_matrix.py

      - name: Create/Update PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: auto/return-matrix
          base: main
          title: "Auto update return matrix"
          commit-message: "Auto update return matrix"
          body: "Automated update of daily_returns.csv and correlation_matrix.csv"
          add-paths: |
            data/daily_returns.csv
            data/correlation_matrix.csv
          delete-branch: false
