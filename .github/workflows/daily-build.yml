name: Build Return Matrix

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"  # Runs daily at 6am UTC

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pandas numpy requests

      - name: Run return matrix script
        run: python scripts/build_return_matrix.py

      - name: Commit results
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data/daily_returns.csv data/correlation_matrix.csv
          git commit -m "Auto update return matrix" || echo "No changes"
          git push
