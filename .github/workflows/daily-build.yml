name: Build Return Matrix

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *" # daily 6am UTC

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: return-matrix
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pandas numpy yfinance scipy

      - name: Run return matrix script
        run: |
          mkdir -p data
          python scripts/build_return_matrix.py

      - name: Build clusters
        run: |
          python scripts/build_clusters.py

      - name: Verify outputs exist (and show files)
        run: |
          echo "Listing data/:"
          ls -lah data
          test -f data/daily_returns.csv
          test -f data/correlation_matrix.csv
          test -f data/clusters.json
          echo "✅ All outputs exist."

      - name: Upload outputs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: return-matrix
          path: |
            data/daily_returns.csv
            data/correlation_matrix.csv
            data/clusters.json
          if-no-files-found: error

      - name: Create/Update PR (optional)
        continue-on-error: true
        uses: peter-evans/create-pull-request@v6
        with:
          branch: auto/return-matrix
          base: main
          title: "Auto update return matrix"
          commit-message: "Auto update return matrix"
          body: "Automated update of daily_returns.csv, correlation_matrix.csv, clusters.json"
          add-paths: |
            data/daily_returns.csv
            data/correlation_matrix.csv
            data/clusters.json
          delete-branch: false
