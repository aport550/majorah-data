name: Build Return Matrix

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: return-matrix
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git/network
        run: |
          git config --global http.version HTTP/1.1
          git config --global http.postBuffer 524288000
          git config --global core.compression 0

      - name: Debug repo structure
        run: |
          set -e
          ls -lah
          ls -lah scripts || true

          for f in \
            scripts/build_return_matrix.py \
            scripts/build_macro_dimensions.py \
            scripts/build_stock_macro_exposures.py \
            scripts/build_clusters.py \
            scripts/build_return_decomposition.py \
            scripts/build_top_correlations.py \
            scripts/build_dividends.py \
            scripts/build_sectors.py \
            scripts/build_fundamental_trends.py \
            scripts/build_stock_balance_sheet_dilution.py \
            scripts/build_stock_screener.py \
            scripts/build_insider_trading.py \
            scripts/build_smart_money.py \
            scripts/update_convictions.py
          do
            if [ ! -f "$f" ]; then
              echo "ERROR: missing $f"
              exit 1
            fi
          done

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance scipy requests beautifulsoup4 supabase python-dotenv

      - name: Create output directories
        run: |
          mkdir -p data
          mkdir -p public/data
          mkdir -p public/data/return_decomposition_shards

      - name: Run return matrix script
        run: python scripts/build_return_matrix.py

      - name: Build macro dimensions
        run: python scripts/build_macro_dimensions.py

      - name: Build stock macro exposures
        run: python scripts/build_stock_macro_exposures.py

      - name: Build clusters
        run: |
          python scripts/build_clusters.py
          ls -lah data/clusters.json || true
          ls -lah public/data/clusters.json || true

      - name: Build return decomposition
        run: |
          python scripts/build_return_decomposition.py --num-shards 16 --max-days 252
          ls -lah public/data/return_decomposition_summary.json || true
          ls -lah public/data/return_decomposition_index.json || true
          ls -lah public/data/return_decomposition_shards || true

      - name: Build top correlations
        run: python scripts/build_top_correlations.py

      - name: Build dividends
        run: python scripts/build_dividends.py

      - name: Build sectors
        run: python scripts/build_sectors.py

      - name: Build fundamental trends
        run: python scripts/build_fundamental_trends.py

      - name: Build stock balance sheet and dilution metrics
        run: python scripts/build_stock_balance_sheet_dilution.py

      - name: Build stock screener
        run: python scripts/build_stock_screener.py

      - name: Build insider trading history
        run: python scripts/build_insider_trading.py

      - name: Build smart money 13F data
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          if [ -z "$SEC_USER_AGENT" ]; then
            export SEC_USER_AGENT="Majorah smart money builder contact: aport550@gmail.com"
          fi
          python scripts/build_smart_money.py

      - name: Update convictions (Supabase)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/update_convictions.py

      - name: Remove old oversized decomposition files
        run: |
          rm -f data/return_decomposition.csv
          rm -f public/data/return_decomposition.json
          rm -f public/data/return_decomposition_by_ticker.json

      - name: Verify outputs
        run: |
          set -e

          required_files=(
            data/daily_returns.csv
            data/correlation_matrix.csv
            data/macro_dimension_scores.csv
            data/stock_macro_exposures.csv
            data/stock_balance_sheet_dilution.csv
            data/stock_screener.csv
            data/insider_trading_history.json

            public/data/clusters.json
            public/data/top_correlations.json
            public/data/vols.json
            public/data/covariance_matrix.csv
            public/data/expected_returns.json
            public/data/dividends.json
            public/data/sectors.json
            public/data/fundamental_trends.json
            public/data/macro_dimension_scores.json
            public/data/stock_macro_exposures.json
            public/data/stock_balance_sheet_dilution.json
            public/data/stock_screener.json
            public/data/stock_screener.csv
            public/data/insider_trading.json
            public/data/insider_trading_summary.json

            public/data/smart_money.json
            data/smart_money_raw.csv
            data/smart_money_fund_holdings.csv
            data/smart_money_unmapped_cusips.csv

            public/data/return_decomposition_summary.json
            public/data/return_decomposition_index.json
          )

          missing=0

          echo "Checking required files..."
          for f in "${required_files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "MISSING FILE: $f"
              missing=1
            else
              echo "OK: $f"
            fi
          done

          if [ ! -d public/data/return_decomposition_shards ]; then
            echo "MISSING DIRECTORY: public/data/return_decomposition_shards"
            missing=1
          else
            echo "OK: public/data/return_decomposition_shards"
          fi

          echo "Shard count:"
          shard_count=$(find public/data/return_decomposition_shards -maxdepth 1 -name 'shard_*.json' | wc -l || echo 0)
          echo "$shard_count"

          if [ "$shard_count" -lt 1 ]; then
            echo "MISSING SHARDS: expected at least 1 shard_*.json"
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            echo "One or more required outputs are missing."
            echo "Recent public/data files:"
            find public/data -maxdepth 2 -type f | sort | tail -100 || true
            echo "Recent data files:"
            find data -maxdepth 1 -type f | sort | tail -100 || true
            exit 1
          fi

      - name: Show file sizes
        run: |
          ls -lah public/data/return_decomposition_summary.json || true
          ls -lah public/data/return_decomposition_index.json || true
          ls -lah public/data/stock_balance_sheet_dilution.json || true
          ls -lah public/data/stock_screener.json || true
          ls -lah public/data/stock_screener.csv || true
          ls -lah data/insider_trading_history.json || true
          ls -lah public/data/insider_trading.json || true
          ls -lah public/data/insider_trading_summary.json || true
          ls -lah public/data/smart_money.json || true
          ls -lah data/smart_money_raw.csv || true
          ls -lah data/smart_money_fund_holdings.csv || true
          ls -lah data/smart_money_unmapped_cusips.csv || true
          du -sh public/data/return_decomposition_shards || true
          find public/data/return_decomposition_shards -maxdepth 1 -name 'shard_*.json' -exec ls -lah {} \; || true

      - name: Upload outputs
        uses: actions/upload-artifact@v6
        with:
          name: return-matrix
          path: |
            data/daily_returns.csv
            data/correlation_matrix.csv
            data/macro_dimension_scores.csv
            data/stock_macro_exposures.csv
            data/stock_balance_sheet_dilution.csv
            data/stock_screener.csv
            data/insider_trading_history.json
            data/smart_money_raw.csv
            data/smart_money_fund_holdings.csv
            data/smart_money_unmapped_cusips.csv
            public/data/clusters.json
            public/data/top_correlations.json
            public/data/vols.json
            public/data/covariance_matrix.csv
            public/data/expected_returns.json
            public/data/dividends.json
            public/data/sectors.json
            public/data/fundamental_trends.json
            public/data/macro_dimension_scores.json
            public/data/stock_macro_exposures.json
            public/data/stock_balance_sheet_dilution.json
            public/data/stock_screener.json
            public/data/stock_screener.csv
            public/data/insider_trading.json
            public/data/insider_trading_summary.json
            public/data/smart_money.json
            public/data/return_decomposition_summary.json
            public/data/return_decomposition_index.json
            public/data/return_decomposition_shards
          if-no-files-found: error

      - name: Show git status
        run: |
          git status --short
          git diff --stat || true

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/daily_returns.csv \
            data/correlation_matrix.csv \
            data/macro_dimension_scores.csv \
            data/stock_macro_exposures.csv \
            data/stock_balance_sheet_dilution.csv \
            data/stock_screener.csv \
            data/insider_trading_history.json \
            data/smart_money_raw.csv \
            data/smart_money_fund_holdings.csv \
            data/smart_money_unmapped_cusips.csv \
            public/data/clusters.json \
            public/data/top_correlations.json \
            public/data/dividends.json \
            public/data/sectors.json \
            public/data/fundamental_trends.json \
            public/data/vols.json \
            public/data/covariance_matrix.csv \
            public/data/expected_returns.json \
            public/data/macro_dimension_scores.json \
            public/data/stock_macro_exposures.json \
            public/data/stock_balance_sheet_dilution.json \
            public/data/stock_screener.json \
            public/data/stock_screener.csv \
            public/data/insider_trading.json \
            public/data/insider_trading_summary.json \
            public/data/smart_money.json \
            public/data/return_decomposition_summary.json \
            public/data/return_decomposition_index.json \
            public/data/return_decomposition_shards

          git rm -f --ignore-unmatch \
            data/return_decomposition.csv \
            public/data/return_decomposition.json \
            public/data/return_decomposition_by_ticker.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "HAS_CHANGES=false" >> $GITHUB_ENV
          else
            git commit -m "Auto update return matrix + screener + insider + smart money + convictions"
            echo "HAS_CHANGES=true" >> $GITHUB_ENV
          fi

      - name: Pull latest main before push
        if: env.HAS_CHANGES == 'true'
        run: git pull --rebase origin main

      - name: Push to main
        if: env.HAS_CHANGES == 'true'
        run: git push origin HEAD:main
