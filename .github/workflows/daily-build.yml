name: Build Return Matrix

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: return-matrix
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Debug repo structure
        run: |
          set -e
          echo "Repo root:"
          ls -lah
          echo ""
          echo "Workflows:"
          ls -lah .github/workflows || true
          echo ""
          echo "Scripts:"
          ls -lah scripts || true
          echo ""
          echo "Does clustering script exist?"
          if [ -f scripts/build_clusters.py ]; then
            echo "OK: scripts/build_clusters.py exists"
          else
            echo "ERROR: scripts/build_clusters.py is missing"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance scipy

      - name: Run return matrix script
        run: |
          mkdir -p data
          python scripts/build_return_matrix.py

      - name: Build clusters
        run: |
          python scripts/build_clusters.py

      - name: Verify outputs
        run: |
          ls -lah data || true
          test -f data/daily_returns.csv
          test -f data/correlation_matrix.csv
          test -f public/data/clusters.json
          echo "All outputs exist."

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: return-matrix
          path: |
            data/daily_returns.csv
            data/correlation_matrix.csv
            public/data/clusters.json
          if-no-files-found: error

      - name: Create PR
        continue-on-error: true
        uses: peter-evans/create-pull-request@v6
        with:
          branch: auto/return-matrix
          base: main
          title: Auto update return matrix
          commit-message: Auto update return matrix
          body: Automated update of generated data files
          add-paths: |
            data/daily_returns.csv
            data/correlation_matrix.csv
            data/clusters.json
